# Everything, in one file. Apply it and the webhook works — the pod mints its own
# certificate at startup and writes it into the webhook config below.
apiVersion: v1
kind: Namespace
metadata:
  name: daemun
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: daemun
  namespace: daemun
---
# The pod needs permission to edit its own webhook config. That is the only
# cluster-level power it has.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: daemun
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    resourceNames: ["daemun"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: daemun
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: daemun
subjects:
  - kind: ServiceAccount
    name: daemun
    namespace: daemun
---
# The policy. Edit this and kubectl apply — the webhook picks it up within about
# a minute, with no rebuild and no restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: daemun-policy
  namespace: daemun
data:
  policy.json: |
    {
      "rules": [
        {
          "name": "ownership",
          "require": { "labels": ["team"] }
        },
        {
          "name": "pinned-images",
          "action": "warn",
          "forbid": { "latestImageTag": true }
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daemun
  namespace: daemun
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daemun
  template:
    metadata:
      labels:
        app: daemun
    spec:
      serviceAccountName: daemun
      containers:
        - name: webhook
          image: daemun:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: policy
              mountPath: /etc/daemun
              readOnly: true
      volumes:
        # Mounted as a volume, not env vars: the kubelet keeps a mounted
        # ConfigMap in sync, so editing it changes policy in a running pod.
        - name: policy
          configMap:
            name: daemun-policy
---
apiVersion: v1
kind: Service
metadata:
  name: daemun
  namespace: daemun
spec:
  selector:
    app: daemun
  ports:
    - port: 443
      targetPort: 8443
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: daemun
webhooks:
  - name: pods.daemun.local
    admissionReviewVersions: ["v1"]
    sideEffects: None

    # If the webhook is unreachable, let the write through. Keep this while
    # learning — Fail means no Pod can be created anywhere if this pod is down.
    failurePolicy: Ignore
    timeoutSeconds: 5

    clientConfig:
      service:
        name: daemun
        namespace: daemun
        path: /validate
        port: 443
      # Deliberately absent. The pod fills this in when it starts.

    rules:
      # Controllers as well as bare Pods, so a bad Deployment is rejected in the
      # terminal that applied it rather than in a ReplicaSet event.
      - operations: ["CREATE", "UPDATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        scope: Namespaced
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["apps"]
        apiVersions: ["v1"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
        scope: Namespaced
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["batch"]
        apiVersions: ["v1"]
        resources: ["jobs"]
        scope: Namespaced

    namespaceSelector:
      matchExpressions:
        # Never gate the control plane, and never gate ourselves — otherwise
        # this pod would need its own approval to start.
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - daemun
